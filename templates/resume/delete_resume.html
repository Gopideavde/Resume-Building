{% extends 'base.html' %}
{% load static %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
<style>
    :root { --primary: #1a2744; --gold: #c9a84c; --bg: #faf8f3; --text: #1a1a2e; --danger: #8b1a3e; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
    h1, h2 { font-family: 'Playfair Display', serif; }
    .danger-card { background: white; border-radius: 20px; padding: 50px; text-align: center; box-shadow: 0 20px 60px rgba(139,26,62,0.15); border-top: 5px solid var(--danger); max-width: 600px; margin: 80px auto; position: relative; overflow: hidden; }
    .danger-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(45deg, var(--danger), var(--danger) 10px, #a8244f 10px, #a8244f 20px); }
    .warning-icon { font-size: 80px; color: var(--danger); margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .btn-danger-custom { background: var(--danger); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: 500; transition: 0.3s; }
    .btn-danger-custom:hover { background: #6b122e; color: white; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139,26,62,0.3); }
</style>
<div class="container" data-aos="zoom-in">
    <div class="danger-card">
        <div class="warning-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h2 class="mb-4">Delete Resume?</h2>
        <p class="lead mb-4">Are you sure you want to delete the resume <strong>"{{ resume.title }}"</strong>? This action cannot be undone and all associated data will be permanently lost.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="{% url 'template_list' %}" class="btn btn-outline-secondary rounded-pill px-4 py-2">Cancel</a>
                <button type="submit" class="btn-danger-custom">Yes, Delete Permanently</button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script>AOS.init({ duration: 600, once: true });</script>
{% endblock %}
