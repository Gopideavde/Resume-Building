{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

    :root {
        --primary: #1a2744;
        --gold: #c9a84c;
        --bg-cream: #faf8f3;
        --text-dark: #1a1a2e;
        --muted: #6b7280;
        --light: #fff8f0;
    }

    body {
        background-color: var(--bg-cream);
        font-family: 'Inter', sans-serif;
    }

    .auth-wrapper {
        min-height: calc(100vh - 80px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem 1rem;
        background: radial-gradient(circle at 50% 0%, rgba(26, 39, 68, 0.05) 0%, transparent 70%);
    }

    .auth-card {
        background: #ffffff;
        width: 100%;
        max-width: 500px;
        border-radius: 16px;
        padding: 4rem 3rem;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        border-top: 4px solid var(--gold);
        text-align: center;
    }

    .success-icon-wrapper {
        width: 100px;
        height: 100px;
        background: #10b981;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 2rem auto;
        color: #ffffff;
        font-size: 3rem;
        position: relative;
    }
    
    .success-icon-wrapper::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 4px solid #10b981;
        opacity: 0.5;
        animation: scaleOut 1.5s ease-out infinite;
    }

    @keyframes scaleOut {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.5); opacity: 0; }
    }

    .auth-card h2 {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        color: var(--primary);
        margin-bottom: 1rem;
    }

    .auth-card p {
        color: var(--muted);
        margin-bottom: 2rem;
        line-height: 1.6;
        font-size: 1.05rem;
    }

    .btn-classic {
        display: inline-block;
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary) 0%, #0d1627 100%);
        color: var(--light);
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 10px 20px rgba(26, 39, 68, 0.2);
    }

    .btn-classic:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(26, 39, 68, 0.3);
        color: var(--gold);
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card" data-aos="zoom-in" data-aos-duration="800">
        <div class="success-icon-wrapper" data-aos="bounce" data-aos-delay="300">
            <i class="fas fa-check"></i>
        </div>
        
        <h2 data-aos="fade-up" data-aos-delay="400">Password Reset Complete</h2>
        
        <p data-aos="fade-up" data-aos-delay="500">
            Your password has been successfully set. You may go ahead and log in now with your new credentials.
        </p>

        <div data-aos="fade-up" data-aos-delay="600">
            <a href="{% url 'login' %}" class="btn-classic">Continue to Login</a>
        </div>
    </div>
</div>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
{% endblock %}
