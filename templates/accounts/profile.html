{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    :root {
        --primary: #1a2744; /* Deep Navy */
        --accent: #c9a84c; /* Gold */
        --secondary: #1e293b;
        --bg: #faf8f3;
        --text: #1a1a2e;
        --light: #fff8f0;
        --muted: #6b7280;
        --border: rgba(201, 168, 76, 0.3);
    }
    
    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
    }

    h1, h2, h3, h4, .font-serif {
        font-family: 'Playfair Display', serif;
    }

    .profile-container {
        max-width: 1000px;
        margin: 4rem auto;
        padding: 0 2rem;
    }

    .profile-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .profile-header h2 {
        font-size: 3rem;
        color: var(--primary);
        margin-bottom: 1rem;
        position: relative;
        display: inline-block;
    }

    .profile-header h2::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: var(--accent);
    }

    .profile-header p {
        color: var(--muted);
        font-size: 1.1rem;
    }

    .profile-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        overflow: hidden;
        border-top: 4px solid var(--accent);
        display: flex;
        flex-direction: column;
    }

    .profile-card-top {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        height: 150px;
        position: relative;
    }

    .profile-card-body {
        padding: 3rem;
        padding-top: 5rem;
        position: relative;
    }

    .avatar-wrapper {
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 120px;
        background: var(--bg);
        border-radius: 50%;
        padding: 5px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        z-index: 2;
    }

    .avatar-placeholder {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        font-size: 3rem;
        border: 2px dashed var(--border);
    }

    .avatar-placeholder i {
        opacity: 0.5;
    }

    .form-wrapper {
        max-width: 600px;
        margin: 0 auto;
    }

    .btn-save {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        margin-top: 2rem;
        box-shadow: 0 10px 20px rgba(26, 39, 68, 0.2);
    }

    .btn-save:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(26, 39, 68, 0.3);
    }

    .btn-save::after {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 50%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: 0.5s;
    }

    .btn-save:hover::after {
        left: 100%;
    }

    /* Override Crispy Forms Styles */
    .crispy-form-wrapper .control-label {
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 0.5rem;
        display: block;
    }
    
    .crispy-form-wrapper .textinput, .crispy-form-wrapper .emailinput, .crispy-form-wrapper .textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        font-size: 1rem;
        transition: all 0.3s ease;
        margin-bottom: 1.5rem;
        color: var(--text);
    }
    
    .crispy-form-wrapper .textinput:focus, .crispy-form-wrapper .emailinput:focus, .crispy-form-wrapper .textarea:focus {
        border-color: var(--accent);
        background: white;
        outline: none;
        box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.1);
    }
    
    .crispy-form-wrapper .help-block {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: -1rem;
        margin-bottom: 1.5rem;
        display: block;
    }

    @media (max-width: 768px) {
        .profile-card-body {
            padding: 2rem;
            padding-top: 5rem;
        }
    }
</style>

<div class="profile-container">
    <div class="profile-header" data-aos="fade-down" data-aos-duration="1000">
        <h2>Your Profile</h2>
        <p>Manage your account settings and personal information</p>
    </div>

    <div class="profile-card" data-aos="fade-up" data-aos-duration="1200">
        <div class="profile-card-top"></div>
        <div class="profile-card-body">
            <div class="avatar-wrapper" data-aos="zoom-in" data-aos-delay="300">
                <div class="avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-wrapper" data-aos="fade-up" data-aos-delay="400">
                <form method="POST" enctype="multipart/form-data" class="crispy-form-wrapper">
                    {% csrf_token %}
                    
                    {{ form|crispy }}
                    
                    <button type="submit" class="btn-save">
                        <i class="fas fa-check-circle" style="margin-right: 8px;"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Add FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Add AOS -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init();
</script>
{% endblock %}
