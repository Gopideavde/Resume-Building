{% load static %}
<style>
/* =============================================
   ADMIN PANEL FOOTER — MINIMAL DARK
   ============================================= */
.admin-footer {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 20px 28px;
}
.admin-footer-inner {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
}
.admin-footer-brand {
    display: flex; align-items: center; gap: 10px;
}
.admin-footer-brand-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff;
}
.admin-footer-brand-text { font-size: 14px; font-weight: 700; color: #cbd5e1; }
.admin-footer-info { font-size: 12.5px; color: #334155; }
.admin-footer-links { display: flex; gap: 16px; }
.admin-footer-links a {
    color: #334155; font-size: 12.5px; text-decoration: none; transition: color 0.25s;
}
.admin-footer-links a:hover { color: #2563eb; }
.admin-footer-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #10b981;
}
.admin-footer-status-dot {
    width: 8px; height: 8px; background: #10b981; border-radius: 50%;
    animation: statusPulse 2s infinite;
}
@keyframes statusPulse {
    0%,100%{opacity:1} 50%{opacity:0.5}
}
</style>

<footer class="admin-footer">
    <div class="admin-footer-inner">
        <!-- Brand -->
        <div class="admin-footer-brand">
            <div class="admin-footer-brand-icon"><i class="bi bi-grid-1x2-fill"></i></div>
            <div class="admin-footer-brand-text">A2Z Admin Panel</div>
        </div>
        <!-- Status -->
        <div class="admin-footer-status">
            <div class="admin-footer-status-dot"></div>
            All systems operational
        </div>
        <!-- Copyright + Links -->
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <div class="admin-footer-links">
                <a href="{% url 'admin_dashboard' %}">Dashboard</a>
                <a href="{% url 'settings' %}">Settings</a>
                <a href="/" target="_blank">View Site</a>
            </div>
            <div class="admin-footer-info">© 2026 A2Z Resume Builder</div>
        </div>
    </div>
</footer>
