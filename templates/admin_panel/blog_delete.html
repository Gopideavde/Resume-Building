{% extends "admin_panel/base.html" %}

{% block title %}
Delete Blog
{% endblock %}

{% block content %}

<style>

.delete-card{

    max-width:700px;

    margin:40px auto;

    border:none;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,.12);

    animation:fadeIn .5s ease;

}

.delete-header{

    background:linear-gradient(135deg,#dc3545,#b91c1c);

    color:#fff;

    padding:20px;

}

.warning-icon{

    width:90px;

    height:90px;

    border-radius:50%;

    background:#fff3f3;

    color:#dc3545;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:50px;

    margin:20px auto;

    animation:pulse 1.5s infinite;

}

.blog-title{

    color:#dc3545;

    font-weight:700;

}

.delete-btn{

    min-width:150px;

    transition:.3s;

}

.delete-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(220,53,69,.35);

}

.cancel-btn{

    min-width:150px;

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@keyframes pulse{

    0%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.08);

    }

    100%{

        transform:scale(1);

    }

}

</style>

<div class="container">

    <div class="card delete-card">

        <div class="delete-header">

            <h3 class="mb-0">

                <i class="bi bi-trash-fill me-2"></i>

                Delete Blog

            </h3>

        </div>

        <div class="card-body text-center p-5">

            <div class="warning-icon">

                <i class="bi bi-exclamation-triangle-fill"></i>

            </div>

            <h4 class="mb-3">

                Are you sure?

            </h4>

            <p class="text-muted">

                You are about to permanently delete this blog.

            </p>

            <h5 class="blog-title mb-4">

                "{{ blog.title }}"

            </h5>

            <div class="alert alert-warning">

                <strong>Warning!</strong>

                This action cannot be undone.

            </div>

            <form method="POST" id="deleteForm">

                {% csrf_token %}

                <button

                    type="submit"

                    class="btn btn-danger delete-btn me-2">

                    <i class="bi bi-trash-fill me-2"></i>

                    Delete Blog

                </button>

                <a

                    href="{% url 'blog_list' %}"

                    class="btn btn-secondary cancel-btn">

                    <i class="bi bi-arrow-left me-2"></i>

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script>

document.getElementById("deleteForm").addEventListener(

"submit",

function(e){

if(!confirm(

"Are you sure you want to permanently delete this blog?"

)){

e.preventDefault();

}

}

);

</script>

{% endblock %}
