{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --primary: #4338ca;
        --secondary: #1e293b;
        --accent-gold: #c9a84c;
        --bg-color: #f8fafc;
        --text-color: #1e293b;
        --light: #ffffff;
    }
    body {
        background-color: var(--bg-color);
        font-family: 'Inter', sans-serif;
    }
    .classic-heading {
        font-family: 'Playfair Display', serif;
    }
    .builder-header {
        background: var(--light);
        padding: 1.5rem 2rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 2px solid var(--accent-gold);
    }
    .saved-badge {
        background: #ecfdf5;
        color: #10b981;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s;
    }
    .saved-badge.show {
        opacity: 1;
    }
    .builder-layout {
        display: flex;
        height: calc(100vh - 80px);
        overflow: hidden;
    }
    .form-panel {
        flex: 1;
        max-width: 600px;
        overflow-y: auto;
        padding: 2rem;
        background: var(--light);
        border-right: 1px solid #e2e8f0;
    }
    .preview-panel {
        flex: 1;
        background: var(--bg-color);
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow-y: auto;
    }
    .step-tabs {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 1rem;
        overflow-x: auto;
    }
    .step-tab {
        background: none;
        border: none;
        color: #64748b;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: all 0.3s;
        border-radius: 8px;
        white-space: nowrap;
    }
    .step-tab.active {
        color: var(--primary);
        background: #eef2ff;
    }
    .step-tab:hover:not(.active) {
        color: var(--secondary);
        background: #f1f5f9;
    }
    .form-card {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        margin-bottom: 1.5rem;
        border: 1px solid #f1f5f9;
        transition: transform 0.3s, box-shadow 0.3s;
    }
    .form-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .preview-container {
        width: 100%;
        max-width: 800px;
        height: 1056px;
        background: white;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        border-radius: 8px;
        overflow: hidden;
    }
    .preview-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    .form-control, .form-select {
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        padding: 0.6rem 1rem;
        transition: all 0.3s;
    }
    .form-control:focus, .form-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }
    .btn-gold {
        background: linear-gradient(135deg, #d4af37, #aa7c11);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 10px 25px;
        font-weight: 600;
        transition: all 0.4s ease;
    }
    .btn-gold:hover {
        box-shadow: 0 10px 20px rgba(201, 168, 76, 0.3);
        transform: translateY(-2px);
    }
</style>

<div class="builder-header">
    <h3 class="classic-heading mb-0"><i class="fas fa-feather-alt" style="color: var(--accent-gold);"></i> Resume Builder</h3>
    <div class="d-flex align-items-center gap-3">
        <div class="saved-badge" id="savedBadge">
            <i class="fas fa-check-circle me-1"></i> All changes saved
        </div>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill px-4">Exit</a>
        <button class="btn-gold" onclick="triggerSave()">Save & Preview</button>
    </div>
</div>

<div class="builder-layout">
    <div class="form-panel" data-aos="fade-right">
        <div class="step-tabs">
            <button class="step-tab active" onclick="showStep(1)">Personal Info</button>
            <button class="step-tab" onclick="showStep(2)">Experience</button>
            <button class="step-tab" onclick="showStep(3)">Education</button>
            <button class="step-tab" onclick="showStep(4)">Skills</button>
        </div>

        <form id="resumeForm" method="POST" action="{% url 'save_resume' %}">
            {% csrf_token %}
            <div id="step1" class="step-content">
                <h4 class="classic-heading mb-4">Personal Details</h4>
                <div class="form-card">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ resume.first_name|default:user.first_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ resume.last_name|default:user.last_name }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Professional Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Senior Software Engineer">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ resume.email|default:user.email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Summary</label>
                            <textarea name="summary" class="form-control" rows="4"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <!-- More steps can be added following the same pattern -->
        </form>
    </div>

    <div class="preview-panel" data-aos="fade-left">
        <div class="preview-container">
            <iframe id="previewIframe" src="{% url 'resume_preview' resume.id %}" class="preview-iframe"></iframe>
        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();

    function showStep(stepNum) {
        document.querySelectorAll('.step-tab').forEach((tab, index) => {
            if(index + 1 === stepNum) tab.classList.add('active');
            else tab.classList.remove('active');
        });
        
        document.querySelectorAll('.step-content').forEach(content => {
            content.style.display = 'none';
        });
        const selectedStep = document.getElementById('step' + stepNum);
        if(selectedStep) {
            selectedStep.style.display = 'block';
            selectedStep.style.animation = 'fadeIn 0.5s ease forwards';
        }
    }
    
    showStep(1);

    function triggerSave() {
        document.getElementById('resumeForm').submit();
        const badge = document.getElementById('savedBadge');
        badge.classList.add('show');
        setTimeout(() => {
            badge.classList.remove('show');
        }, 3000);
    }
</script>
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
