{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --primary: #1a2744;
        --gold: #c9a84c;
        --bg: #faf8f3;
        --text: #1a1a2e;
        --card-bg: rgba(255, 255, 255, 0.85);
    }
    
    body {
        background-color: var(--bg);
        font-family: 'Inter', sans-serif;
        color: var(--text);
    }
    
    .serif { font-family: 'Playfair Display', serif; }

    /* Builder Layout */
    .builder-layout {
        display: flex;
        height: calc(100vh - 80px); /* Adjust based on navbar */
        width: 100%;
        overflow: hidden;
    }

    /* Left Pane - Form */
    .editor-pane {
        width: 50%;
        background: var(--bg);
        overflow-y: auto;
        padding: 40px;
        position: relative;
    }
    
    /* Modern Stepper */
    .stepper {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
        overflow-x: auto;
        padding-bottom: 10px;
        scrollbar-width: none;
    }
    
    .step-item {
        background: white;
        padding: 12px 24px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.4s;
        border: 1px solid #e5e7eb;
        white-space: nowrap;
    }
    
    .step-item.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 8px 20px rgba(26,39,68,0.2);
        transform: translateY(-2px);
    }
    
    /* Glassmorphism Section Cards */
    .section-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.4);
        border-radius: 20px;
        padding: 35px;
        margin-bottom: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.04);
        display: none;
        animation: fadeIn 0.5s ease forwards;
    }
    
    .section-card.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
        color: var(--primary);
        font-size: 1.8rem;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .section-title i { color: var(--gold); }

    /* Input Focus Animations */
    .form-group { margin-bottom: 20px; position: relative; }
    .form-label { display: block; font-weight: 600; font-size: 0.85rem; color: var(--primary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control {
        width: 100%;
        padding: 14px 18px;
        background: #f9fafb;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 1rem;
        color: var(--text);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
    }
    
    .form-control:focus {
        background: white;
        border-color: var(--gold);
        box-shadow: 0 10px 25px rgba(201,168,76,0.15);
        transform: translateY(-2px);
    }

    /* Right Pane - Preview Iframe */
    .preview-pane {
        width: 50%;
        background: #e5e7eb;
        padding: 20px;
        position: relative;
    }
    
    .preview-wrapper {
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        overflow: hidden;
    }

    /* IMPORTANT: Keeping the iframe structure exactly for AJAX debounce */
    #resume-preview-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .debounce-indicator {
        position: absolute;
        top: 30px;
        right: 30px;
        background: var(--primary);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        display: none;
        align-items: center;
        gap: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .debounce-indicator.saving { display: flex; }
</style>

<div class="builder-layout" data-aos="fade-in">
    <!-- Editor Pane -->
    <div class="editor-pane">
        
        <!-- Stepper -->
        <div class="stepper" id="stepper">
            <div class="step-item active" onclick="showSection(0)">Personal</div>
            <div class="step-item" onclick="showSection(1)">Experience</div>
            <div class="step-item" onclick="showSection(2)">Education</div>
        </div>
        
        <!-- Form -->
        <form id="resumeForm" method="POST">
            {% csrf_token %}
            
            <!-- Section 1 -->
            <div class="section-card active" id="section-0">
                <h2 class="section-title serif"><i class="fas fa-user"></i> Personal Info</h2>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control debounce-input" value="{{ form.full_name.value|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="job_title" class="form-control debounce-input" value="{{ form.job_title.value|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Summary</label>
                    <textarea name="summary" class="form-control debounce-input" rows="4">{{ form.summary.value|default:'' }}</textarea>
                </div>
            </div>
            
            <!-- Section 2 -->
            <div class="section-card" id="section-1">
                <h2 class="section-title serif"><i class="fas fa-briefcase"></i> Experience</h2>
                <p class="text-muted mb-4">Add your professional work experience here.</p>
                <!-- Dynamic formset content would go here -->
                <div class="form-group">
                    <label class="form-label">Company</label>
                    <input type="text" name="company" class="form-control debounce-input">
                </div>
            </div>
            
            <!-- Section 3 -->
            <div class="section-card" id="section-2">
                <h2 class="section-title serif"><i class="fas fa-graduation-cap"></i> Education</h2>
                <p class="text-muted mb-4">Add your academic qualifications.</p>
                <div class="form-group">
                    <label class="form-label">Degree</label>
                    <input type="text" name="degree" class="form-control debounce-input">
                </div>
            </div>
        </form>
    </div>
    
    <!-- Preview Pane -->
    <div class="preview-pane">
        <div class="debounce-indicator" id="saveIndicator">
            <i class="fas fa-circle-notch fa-spin"></i> Updating Preview...
        </div>
        <div class="preview-wrapper" data-aos="zoom-in" data-aos-delay="200">
            <!-- IMPORTANT: Maintained exact iframe structure for AJAX Debounce -->
            <iframe id="resume-preview-iframe" src="{% url 'resume_preview' %}"></iframe>
        </div>
    </div>
</div>

<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script>
    AOS.init();
    
    // Stepper Logic
    function showSection(index) {
        document.querySelectorAll('.section-card').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.step-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
    }

    // Debounce Logic Hook (Ensuring visual feedback works with iframe)
    const inputs = document.querySelectorAll('.debounce-input');
    const indicator = document.getElementById('saveIndicator');
    const iframe = document.getElementById('resume-preview-iframe');
    
    let debounceTimer;
    inputs.forEach(input => {
        input.addEventListener('input', () => {
            indicator.classList.add('saving');
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                // Trigger form save/ajax here in actual implementation
                // Reload iframe on success
                iframe.src = iframe.src; 
                indicator.classList.remove('saving');
            }, 1000);
        });
    });
</script>
{% endblock %}
